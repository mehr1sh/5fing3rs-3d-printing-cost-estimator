name: CI Pipeline

on:
  push:
    branches: [main, develop, "feat/**", "release/**"]
  pull_request:
    branches: [main, develop]

jobs:
  # ---------------------------------------------------------------------------
  # Backend: unit + integration tests
  # Uses SQLite (file-based, not :memory:) to match conftest.py behaviour.
  # JSONB → JSON patching is handled inside conftest.py automatically.
  # ---------------------------------------------------------------------------
  backend-tests:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # confest.py is misnamed in the repo — pytest requires exactly "conftest.py"
      # to auto-load fixtures. Rename it here so CI works without a repo change.
      - name: Fix conftest filename (confest.py → conftest.py)
        run: |
          if [ -f tests/confest.py ] && [ ! -f tests/conftest.py ]; then
            cp tests/confest.py tests/conftest.py
          fi

      # conftest.py creates test_run.db (SQLite file) automatically.
      # We only need the non-DB env vars here.
      - name: Create test .env
        run: |
          cat > .env <<EOF
          DATABASE_URL=sqlite:///./test_run.db
          SECRET_KEY=ci-test-secret-key
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=60
          MAILTRAP_API_TOKEN=
          EOF

      - name: Create reports directory
        run: mkdir -p reports

      # ── Unit tests (cost calculator + file validators) ─────────────────────
      # test_cost_validators.py uses MagicMock — no DB connection needed.
      # test_estimation.py only checks callable(calculate_cost) — also safe.
      - name: Run unit tests
        run: |
          pytest tests/test_cost_validators.py \
                 tests/test_estimation.py \
            -v --tb=short \
            --junitxml=reports/unit-results.xml

      # ── Integration tests (auth + upload routes) ───────────────────────────
      # These use the `client` fixture from conftest.py which wires FastAPI
      # to the SQLite test DB via dependency override.
      # NOTE: test_auth.py and test_upload.py use a module-level TestClient
      # (no fixture) so they hit the real DATABASE_URL — keep them here so
      # the .env above is present.
      # NOTE: text_auth_extended.py and text_upload_extended.py are named with
      # "text_" prefix (not "test_") so pytest won't auto-discover them —
      # they must be listed explicitly.
      - name: Run integration tests
        run: |
          pytest tests/test_auth.py \
                 tests/test_upload.py \
                 tests/text_auth_extended.py \
                 tests/text_upload_extended.py \
            -v --tb=short \
            --junitxml=reports/integration-results.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/reports/

  # ---------------------------------------------------------------------------
  # Frontend: install + type-check + build
  # ---------------------------------------------------------------------------
  frontend-build:
    name: Frontend Build Check (React/TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000

  # ---------------------------------------------------------------------------
  # Lint: flake8 on backend app/ (non-blocking for now)
  # ---------------------------------------------------------------------------
  backend-lint:
    name: Backend Lint (flake8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        # E501 = line too long  |  W503 = line break before binary op
        run: flake8 app/ --max-line-length=120 --ignore=E501,W503 --statistics
        continue-on-error: true   # warnings only — remove to make this blocking
        
