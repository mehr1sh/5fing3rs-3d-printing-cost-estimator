name: CI Pipeline

on:
  push:
    branches: [main, develop, "feat/**", "release/**", "add-tests"]
  pull_request:
    branches: [main, develop]

jobs:
  # ---------------------------------------------------------------------------
  # Backend: unit + integration tests
  # ---------------------------------------------------------------------------
  backend-tests:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fix conftest filename (confest.py → conftest.py)
        run: |
          if [ -f tests/confest.py ] && [ ! -f tests/conftest.py ]; then
            cp tests/confest.py tests/conftest.py
          fi

      - name: Create test .env
        run: |
          cat > .env <<EOF
          DATABASE_URL=sqlite:///./test_run.db
          SECRET_KEY=ci-test-secret-key
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=60
          MAILTRAP_API_TOKEN=
          EOF

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run unit tests
        run: |
          pytest tests/test_cost_validators.py \
                 tests/test_estimation.py \
            -v --tb=short \
            --junitxml=reports/unit-results.xml
        continue-on-error: true

      - name: Run integration tests
        run: |
          pytest tests/test_auth.py \
                 tests/test_upload.py \
                 tests/text_auth_extended.py \
                 tests/text_upload_extended.py \
            -v --tb=short \
            --junitxml=reports/integration-results.xml
        continue-on-error: true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/reports/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Frontend: install + type-check + build
  # ---------------------------------------------------------------------------
  frontend-build:
    name: Frontend Build Check (React/TS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Generate package-lock.json if missing
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only
          fi

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000

  # ---------------------------------------------------------------------------
  # Lint: flake8 on backend app/ (non-blocking)
  # ---------------------------------------------------------------------------
  backend-lint:
    name: Backend Lint (flake8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        run: flake8 app/ --max-line-length=120 --ignore=E501,W503 --statistics
        continue-on-error: true
        
