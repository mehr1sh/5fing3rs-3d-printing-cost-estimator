name: CI Pipeline

on:
  push:
    branches: [main, develop, "feat/**", "release/**"]
  pull_request:
    branches: [main, develop]

jobs:
  # ---------------------------------------------------------------------------
  # Backend: unit + integration tests
  # Uses SQLite in-memory so no real PostgreSQL container is needed.
  # ---------------------------------------------------------------------------
  backend-tests:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # SQLite driver is included in Python stdlib — no extra install needed.
      # The conftest.py fixture overrides DATABASE_URL with sqlite:///:memory:
      - name: Create test .env
        run: |
          cat > .env <<EOF
          DATABASE_URL=sqlite:///:memory:
          SECRET_KEY=ci-test-secret-key
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=60
          MAILTRAP_API_TOKEN=
          EOF

      - name: Run unit tests
        run: |
          pytest tests/test_unit_cost_calculator.py \
            -v \
            --tb=short \
            --junitxml=reports/unit-results.xml

      - name: Run integration tests
        run: |
          pytest tests/test_integration_auth.py tests/test_integration_admin.py \
            -v \
            --tb=short \
            --junitxml=reports/integration-results.xml

      - name: Upload test reports
        if: always()   # upload even if tests fail so you can inspect failures
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/reports/

  # ---------------------------------------------------------------------------
  # Frontend: install and build check
  # A build failure means a TypeScript or import error was introduced.
  # ---------------------------------------------------------------------------
  frontend-build:
    name: Frontend Build Check (React/TS)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000

  # ---------------------------------------------------------------------------
  # Lint: quick code quality gate (no blocking failures, just warnings for now)
  # ---------------------------------------------------------------------------
  backend-lint:
    name: Backend Lint (flake8)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8
        # E501 = line too long (ignored — not worth failing CI over)
        # W503 = line break before binary op (style preference)
        run: flake8 app/ --max-line-length=120 --ignore=E501,W503 --statistics
        continue-on-error: true   # warnings only for now; remove this line to make lint blocking